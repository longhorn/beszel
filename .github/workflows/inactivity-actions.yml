name: 'Issue and PR Maintenance'

on:
  schedule:
    - cron: '0 0 * * *'   # runs at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock-inactive:
    name: Lock Inactive Issues
    runs-on: ubuntu-24.04
    steps:
      - uses: klaasnicolaas/action-inactivity-lock@fd4424ae1e882e9aefc4f3ff87a4f51807f49788 # v1.1.3
        id: lock
        with:
          days-inactive-issues: 14
          lock-reason-issues: ""
          # Action can not skip PRs, set it to 100 years to cover it.
          days-inactive-prs: 36524
          lock-reason-prs: ""

  close-stale:
    name: Close Stale Issues
    runs-on: ubuntu-24.04
    steps:
      - name: Close Stale Issues
        uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f # v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Messaging
          stale-issue-message: >
            👋 This issue has been automatically marked as stale due to inactivity.
            If this issue is still relevant, please comment to keep it open.
            Without activity, it will be closed in 7 days.

          close-issue-message: >
            🔒 This issue has been automatically closed due to prolonged inactivity.
            Feel free to open a new issue if you have further questions or concerns.

          # Timing
          days-before-issue-stale: 14
          days-before-issue-close: 7
          # Action can not skip PRs, set it to 100 years to cover it.
          days-before-pr-stale: 36524

          # Labels
          stale-issue-label: 'stale'
          remove-stale-when-updated: true
          only-issue-labels: 'awaiting-requester'

          # Exemptions
          exempt-assignees: true
          exempt-milestones: true
